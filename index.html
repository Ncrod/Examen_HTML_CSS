<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matricula</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="matricula">
        <h1>Solicitud de Matrícula</h1>
        <p class="subtitulo">Completa los datos y te contactaremos para iniciar el curso</p>

        <form id="contacto">
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
            </div>
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="Ingresa tu correo electrónico">
            </div>
            <div class="campo">
                <label for="telefono">Numero de teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" pattern="[0-9]{7,10}" required>
            </div>

            <div class="campo">
                <label for="curso">Tipo de curso</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecciona un curso</option>
                    <option value="carro">Carro</option>
                    <option value="moto">Moto</option>
                    <option value="mixto">Mixto</option>
                </select>
            </div>

            <div class="campo campo-completo">
                <label for="mensaje">Mensaje / Comentario</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" rows="4"></textarea>
            </div>

            <button type="submit" class="boton-enviar">Enviar solicitud</button>
        </form>
    </section>
    
</body>
</html>
